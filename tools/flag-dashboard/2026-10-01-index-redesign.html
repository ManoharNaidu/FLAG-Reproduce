<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLAG progress</title><link rel="stylesheet" href="/palette.css">
<style>
/* Colour roles. Base tokens (--bg --fg --muted --accent --ok --warn --bad) come from
   palette.json via /palette.css; everything below is derived from them, no literals. */
:root{
  --run:var(--accent); --done:var(--ok); --fail:var(--bad); --warning:var(--warn);
  --line:color-mix(in srgb,var(--muted) 22%,transparent);
  --track:color-mix(in srgb,var(--muted) 24%,transparent);
  --surface:color-mix(in srgb,var(--fg) 4%,var(--bg));
  --wash-run:color-mix(in srgb,var(--run) 9%,var(--bg));
  --heat-low:color-mix(in srgb,var(--fail) 22%,var(--bg));
  --heat-mid:color-mix(in srgb,var(--warning) 22%,var(--bg));
  --heat-high:color-mix(in srgb,var(--done) 22%,var(--bg));
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--run);outline-offset:2px}

/* header */
header{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--st,var(--muted)) 9%,var(--bg));border-bottom:1px solid var(--line)}
.hrow{max-width:1640px;margin:0 auto;padding:10px 20px 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px}
h1{font-size:17px;margin:0 6px 0 0}
.pill{font-weight:600;color:var(--st,var(--muted))}
.hbig{font-weight:600}
.crit{color:var(--muted)}
.crit b{color:var(--fg);font-weight:600}
.overall{height:5px;background:var(--track)}
.overall>i{display:block;height:100%;background:var(--st-bar,var(--run))}

main{max-width:1640px;margin:0 auto;padding:6px 20px 32px}
h2{font-size:12.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--fg);margin:20px 0 8px}
h2 .muted{font-weight:400;letter-spacing:0;text-transform:none}
.banner{margin:12px 0 0;padding:6px 10px;border-radius:6px;background:color-mix(in srgb,var(--fail) 12%,var(--bg));color:var(--fail)}
.banner[hidden]{display:none}

/* two-column layout on wide screens */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 32px}
@media(min-width:1200px){.cols{grid-template-columns:minmax(380px,5fr) minmax(0,8fr)}}

/* bars */
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--run));border-radius:3px}
.c-run{--c:var(--run)}.c-done{--c:var(--done)}.c-fail{--c:var(--fail)}.c-warn{--c:var(--warning)}
.t-run{color:var(--run)}.t-done{color:var(--done)}.t-fail{color:var(--fail)}.t-warn{color:var(--warning)}

/* runs by variant */
.vrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.vrow .bar{grid-column:1/-1}

/* GPUs */
.grow{display:grid;grid-template-columns:4.2em 1fr;gap:3px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.grow .name{grid-row:span 2;font-weight:600;align-self:center}
.metric{display:grid;grid-template-columns:3.6em 1fr 6.5em;gap:8px;align-items:center}
.metric .lbl{color:var(--muted);font-size:12px}
.metric .val{text-align:right}
.grow .sub{grid-column:2;font-size:12px;color:var(--muted)}
.jobs{padding:8px 0;color:var(--muted)}

/* filter chips */
.filters{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 8px}
.fgroup{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.fgroup>span{font-size:12px;color:var(--muted);margin-right:2px}
.chip{font:inherit;font-size:12.5px;min-height:26px;padding:2px 10px;border-radius:13px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--wash-run);border-color:var(--run);color:var(--fg)}
.chip.reset{border-style:dashed;color:var(--muted)}

/* unfinished cells table */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
th button.sort{font:inherit;color:inherit;background:none;border:0;padding:2px 0;cursor:pointer;min-height:24px}
th button.sort::after{content:" ↕";opacity:.45}
th[aria-sort="ascending"] button.sort::after{content:" ↑";opacity:1}
th[aria-sort="descending"] button.sort::after{content:" ↓";opacity:1}
.r{text-align:right}
th:last-child,td:last-child{padding-right:0}
td.vs{white-space:nowrap}
td.prog{width:150px}
.prog .wrap{display:grid;grid-template-columns:3.4em 1fr;gap:8px;align-items:center}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.b-run{color:var(--run);background:var(--wash-run)}
.b-queued{color:var(--muted)}
.b-crit{color:var(--fg);border-color:var(--run);margin-left:8px;font-weight:600}
tr.critical td{background:var(--wash-run)}
td.eta{white-space:nowrap}
td.eta em{color:var(--muted)}
tr.grp th{padding:10px 0 4px;border-bottom:1px solid var(--line)}
tr.grp button{font:inherit;font-weight:600;color:var(--fg);background:none;border:0;padding:2px 0;cursor:pointer;display:flex;flex-wrap:wrap;text-align:left;gap:2px 10px;align-items:baseline;min-height:26px}
tr.grp button .muted{font-weight:400}
tr.grp button::before{content:"▾";color:var(--muted);width:1em}
tr.grp button[aria-expanded="false"]::before{content:"▸"}
.empty{padding:10px 0}

/* failures, llm, coverage */
.oneline{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin:20px 0 0}
.oneline h2{margin:0}
details>summary{cursor:pointer;min-height:24px;padding:2px 0;list-style-position:inside}
details>summary h2{display:inline;margin:0}
ul.fails{margin:6px 0 0;padding-left:1.2em;color:var(--fail)}
.heat{table-layout:fixed}
.heat td{text-align:center;font-weight:600;border:2px solid var(--bg);border-radius:4px}
.heat thead th:first-child{width:9em;text-align:left}
#cov{margin-top:16px}
.heat th[scope="row"]{white-space:nowrap}
.heat thead th{text-align:center;white-space:normal}
.h-low{background:var(--heat-low)}.h-mid{background:var(--heat-mid)}.h-high{background:var(--heat-high)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 0;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px;background:var(--sw)}
.short{display:none}
@media(max-width:560px){#open-table{font-size:13px}main{padding:6px 12px 28px}.hrow{padding:10px 12px 8px}td.vs{white-space:normal}.b-crit{display:table;margin:2px 0 0;white-space:normal}th,td{padding-right:6px}td.eta{white-space:normal}.long{display:none}.short{display:inline}.heat td,.heat th{font-size:12px;padding-right:4px}.metric{grid-template-columns:3.2em 1fr 5.6em}td.prog{width:54px}.prog .wrap{grid-template-columns:1fr}.hide-sm{display:none}}
@media(prefers-reduced-motion:no-preference){.bar>i,.overall>i{transition:width .4s ease}}
</style></head><body>
<header id="hdr">
  <div class="hrow">
    <h1>FLAG progress</h1>
    <span id="pill" class="pill">○ loading</span>
    <span id="overall" class="num hbig"></span>
    <span id="pct" class="num hbig"></span>
    <span id="eta" class="num"></span>
    <span id="crit" class="crit"></span>
    <span id="upd" class="muted num"></span>
  </div>
  <div class="overall" role="progressbar" aria-label="Overall runs" id="obar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="obar-i" style="width:0"></i></div>
</header>
<main>
  <div id="banner" class="banner" role="alert" hidden></div>
  <p id="live" class="sr" aria-live="polite"></p>

  <div class="cols">
    <div>
      <section aria-labelledby="h-prog"><h2 id="h-prog">Runs by variant</h2><div id="groups"><p class="muted">Loading…</p></div></section>
      <section aria-labelledby="h-gpu"><h2 id="h-gpu">GPUs</h2><div id="gpus"><p class="muted">Loading…</p></div></section>
    </div>
    <section aria-labelledby="h-open"><h2 id="h-open">Unfinished cells <span id="open-n" class="muted"></span></h2>
      <div id="filters" class="filters" aria-label="Filters"></div>
      <table id="open-table">
        <thead><tr>
          <th scope="col" data-key="variant"><button class="sort" type="button">Variant · sampler</button></th>
          <th scope="col" data-key="model"><button class="sort" type="button">Model</button></th>
          <th scope="col" data-key="done"><button class="sort" type="button">Runs</button></th>
          <th scope="col" data-key="now" class="hide-sm"><button class="sort" type="button">Now</button></th>
          <th scope="col" data-key="eta" class="r"><button class="sort" type="button"><span class="long">Est. left</span><span class="short">Left</span></button></th>
        </tr></thead>
        <tbody id="open"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </section>
  </div>

  <section aria-labelledby="h-fail" id="fail-sec"></section>
  <section aria-labelledby="h-llm" id="llm-sec"></section>
  <section aria-labelledby="h-cov">
    <details id="cov" open><summary><h2 id="h-cov">Node coverage per cache</h2></summary>
      <table class="heat"><thead><tr><th scope="col">Dataset</th>
        <th scope="col" title="Discriminative · cosine"><span class="long">Discriminative · cosine</span><abbr class="short" title="Discriminative · cosine">Disc · cos</abbr></th><th scope="col" title="Discriminative · FLAG-MD"><span class="long">Discriminative · FLAG-MD</span><abbr class="short" title="Discriminative · FLAG-MD">Disc · MD</abbr></th>
        <th scope="col" title="Residual · cosine"><span class="long">Residual · cosine</span><abbr class="short" title="Residual · cosine">Resid · cos</abbr></th><th scope="col" title="Residual · FLAG-MD"><span class="long">Residual · FLAG-MD</span><abbr class="short" title="Residual · FLAG-MD">Resid · MD</abbr></th></tr></thead>
        <tbody id="llm"></tbody></table>
      <div class="legend" aria-label="Legend">
        <span style="--sw:var(--heat-low)">below 25%</span><span style="--sw:var(--heat-mid)">25–75%</span><span style="--sw:var(--heat-high)">above 75%</span>
      </div>
    </details>
  </section>
</main>
<script>
// All rendering goes through el(): text is set with textContent, never parsed as HTML.
const $=id=>document.getElementById(id);
function el(tag,props,...kids){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false)continue;
    if(k==='class')n.className=v; else if(k==='width')n.style.width=v;
    else if(k==='style')n.setAttribute('style',v); else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?'':v);
  }
  for(const k of kids.flat()) if(k!=null&&k!==false) n.append(k instanceof Node?k:String(k));
  return n;
}
const pct=(a,b)=>b?Math.round(100*a/b):0;
// "3h 06m", "19m", "<1m"
const fmt=s=>{if(s==null)return '—';if(s<60)return '<1m';const m=Math.round(s/60);if(m<60)return `${m}m`;
  return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`;};
const bar=(p,cls='c-run')=>el('div',{class:'bar '+cls,role:'presentation'},el('i',{width:Math.max(0,Math.min(100,p))+'%'}));
const NAMES={baseline:'baseline',flag:'flag',flag_finetuned:'flag_finetuned',default:'default',cosine:'cosine',md_K2_matched:'FLAG-MD'};
const DS={reddit:'Reddit',instagram:'Instagram',amazon_text:'Amazon',yelpchi_text:'YelpChi'};
const STATE={running:['● running','run'],done:['✓ done','done'],failing:['✕ failures','fail'],idle:['○ idle','']};
const SHORT={baseline:'base',flag:'F',flag_finetuned:'F*',default:'',cosine:'cos',md_K2_matched:'MD'};
const vsName=c=>`${NAMES[c.variant]} · ${NAMES[c.sampler]||c.sampler}`;
const nowKey=c=>c.running?c.device.toUpperCase():'Queued';

// per-viewer UI state (filters, sort, collapsed groups); storage is optional
const UI=(()=>{let s={};try{s=JSON.parse(localStorage.getItem('flagdash-ui')||'{}')}catch(e){}
  return Object.assign({f:{variant:[],dataset:[],now:[]},sort:{key:'eta',dir:'descending'},collapsed:[]},s);})();
const saveUI=()=>{try{localStorage.setItem('flagdash-ui',JSON.stringify(UI))}catch(e){}};
let lastState=null,lastData=0,DATA=null;

function renderHeader(d){
  const [label,role]=STATE[d.state]||['○ '+d.state,''];
  const col=role?`var(--${role})`:'var(--muted)';
  $('hdr').style.setProperty('--st',col);
  $('hdr').style.setProperty('--st-bar',d.state==='done'?'var(--done)':d.state==='failing'?'var(--fail)':'var(--run)');
  $('pill').textContent=label;
  const p=pct(d.done,d.total);
  $('overall').textContent=`${d.done.toLocaleString()} / ${d.total.toLocaleString()} runs`;
  $('pct').textContent=`${p}%`;
  $('obar-i').style.width=p+'%';$('obar').setAttribute('aria-valuenow',p);
  $('eta').textContent=d.state==='done'?'':`est. ${fmt(d.eta_s)} left${d.eta_partial?'+':''}`;
  $('eta').title=d.eta_partial?'Some cells have no finished run yet, so the estimate may grow':'';
  const c=critical(d);
  $('crit').replaceChildren(c?el('span',{},'critical: ',el('b',{},`${vsName(c)} / ${DS[c.dataset]||c.dataset} / ${c.model}`)):'');
  if(d.state!==lastState){if(lastState!==null)$('live').textContent=`Status changed to ${d.state}`;lastState=d.state;}
}
// row with the longest known remaining time
function critical(d){let best=null;for(const c of d.open_cells||[])if(c.eta_s!=null&&(!best||c.eta_s>best.eta_s))best=c;return best;}

function renderLeft(d){
  $('groups').replaceChildren(...d.groups.map(g=>{const full=g.done>=g.total;
    return el('div',{class:'vrow'},el('span',{},NAMES[g.variant]+(g.sampler!=='default'?' · '+NAMES[g.sampler]:'')),
      el('span',{class:'num '+(full?'t-done':'')},`${g.done} / ${g.total}${full?' ✓':''}`),bar(pct(g.done,g.total),full?'c-done':'c-run'));}));
  const onGpu=[...new Set((d.open_cells||[]).filter(c=>c.device==='gpu').map(c=>`${c.model}/${DS[c.dataset]||c.dataset}`))].join(', ');
  $('gpus').replaceChildren(...(d.gpus.length?d.gpus.map(g=>{
    const busy=(g.util||0)>5,mem=g.mem_total?100*(g.mem_used||0)/g.mem_total:0;
    return el('div',{class:'grow'},el('span',{class:'name num'},`GPU ${g.index}`),
      el('div',{},
        el('div',{class:'metric'},el('span',{class:'lbl'},'util'),bar(g.util||0,busy?'c-run':''),el('span',{class:'val num'},`${busy?'':'idle · '}${g.util??'—'}%`)),
        el('div',{class:'metric'},el('span',{class:'lbl'},'memory'),bar(mem,'c-run'),
          el('span',{class:'val num'},`${Math.round((g.mem_used||0)/1024)} / ${Math.round((g.mem_total||0)/1024)} GB`))),
      el('span',{class:'sub num'},`${g.temp??'—'} °C · ${Math.round(g.power||0)} W`));
  }):[el('p',{class:'muted'},'nvidia-smi unavailable')]),
    el('div',{class:'jobs'},`Jobs: ${d.procs.train_gpu} GPU runs${onGpu?' ('+onGpu+')':''} · ${d.procs.train_cpu} CPU runs · ${d.procs.llm} LLM`));
}

function chip(cat,value,label){
  const on=UI.f[cat].includes(value);
  return el('button',{type:'button',class:'chip','aria-pressed':String(on),onclick:()=>{
    UI.f[cat]=on?UI.f[cat].filter(v=>v!==value):[...UI.f[cat],value];saveUI();renderTable(DATA);}},label);
}
function renderFilters(cells){
  const uniq=f=>[...new Set(cells.map(f))];
  const groups=[['variant','Variant',uniq(vsName).sort(),v=>v],
                ['dataset','Dataset',Object.keys(DS).filter(k=>cells.some(c=>c.dataset===k)),k=>DS[k]],
                ['now','Device',['GPU','CPU','Queued'].filter(k=>cells.some(c=>nowKey(c)===k)),k=>k]];
  const active=Object.values(UI.f).some(a=>a.length);
  $('filters').replaceChildren(...[...groups.map(([cat,label,vals,name])=>el('div',{class:'fgroup',role:'group','aria-label':label},
      el('span',{},label),vals.map(v=>chip(cat,v,name(v))))),
    active?el('button',{type:'button',class:'chip reset',onclick:()=>{UI.f={variant:[],dataset:[],now:[]};saveUI();renderTable(DATA);}},'Reset filters'):null].filter(Boolean));
}
const SORTERS={variant:c=>vsName(c),model:c=>c.model,done:c=>c.done,now:c=>nowKey(c),eta:c=>c.eta_s??-1};
function renderTable(d){
  const all=d.open_cells||[];
  renderFilters(all);
  const f=UI.f;
  const cells=all.filter(c=>(!f.variant.length||f.variant.includes(vsName(c)))&&(!f.dataset.length||f.dataset.includes(c.dataset))&&(!f.now.length||f.now.includes(nowKey(c))));
  $('open-n').textContent=all.length?`(${cells.length===all.length?all.length:cells.length+' of '+all.length})`:'';
  document.querySelectorAll('#open-table thead th').forEach(th=>th.setAttribute('aria-sort',th.dataset.key===UI.sort.key?UI.sort.dir:'none'));
  const key=SORTERS[UI.sort.key],dir=UI.sort.dir==='ascending'?1:-1;
  const cmp=(a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*dir;};
  const crit=critical(d);
  const byDs={};cells.forEach(c=>(byDs[c.dataset]=byDs[c.dataset]||[]).push(c));
  const order=Object.keys(byDs).sort((a,b)=>Math.max(...byDs[b].map(c=>c.eta_s??0))-Math.max(...byDs[a].map(c=>c.eta_s??0)));
  const tbody=$('open');
  if(!all.length){tbody.replaceChildren(el('tr',{},el('td',{colspan:5,class:'empty t-done'},'✓ Every cell has 25 runs')));return;}
  if(!cells.length){tbody.replaceChildren(el('tr',{},el('td',{colspan:5,class:'empty muted'},'No cells match the filters.')));return;}
  const rows=[];
  for(const ds of order){
    const list=byDs[ds].sort(cmp), open=!UI.collapsed.includes(ds);
    const total=list.reduce((s,c)=>s+(c.eta_s||0),0), partial=list.some(c=>c.eta_s==null);
    rows.push(el('tr',{class:'grp'},el('th',{colspan:5,scope:'rowgroup'},el('button',{type:'button','aria-expanded':String(open),
      onclick:()=>{UI.collapsed=open?[...UI.collapsed,ds]:UI.collapsed.filter(x=>x!==ds);saveUI();renderTable(DATA);}},
      DS[ds]||ds,el('span',{class:'muted num'},`${list.length} ${list.length===1?'cell':'cells'} · total ${fmt(total)}${partial?'+':''}`)))));
    if(!open)continue;
    for(const c of list){
      const isCrit=crit&&c===crit;
      rows.push(el('tr',{class:isCrit?'critical':null},
        el('td',{class:'vs'},el('span',{class:'long'},vsName(c)),el('abbr',{class:'short',title:vsName(c)},`${SHORT[c.variant]} · ${SHORT[c.sampler]}`),isCrit?el('span',{class:'badge b-crit'},'critical path'):null),
        el('td',{},c.model),
        el('td',{class:'prog'},el('div',{class:'wrap'},el('span',{class:'num r'},`${c.done}/25`),bar(pct(c.done,25),'c-run'))),
        el('td',{class:'hide-sm'},c.running?el('span',{class:'badge b-run'},`${c.device.toUpperCase()} ×${c.running}`):el('span',{class:'badge b-queued'},'Queued')),
        el('td',{class:'eta r num'},c.eta_s!=null?fmt(c.eta_s):c.running?[el('em',{class:'long'},'measuring'),el('em',{class:'short',title:'measuring: no run finished yet'},'…')]:'—')));
    }
  }
  tbody.replaceChildren(...rows);
}
document.querySelectorAll('#open-table thead th').forEach(th=>th.querySelector('button').addEventListener('click',()=>{
  const k=th.dataset.key;UI.sort=UI.sort.key===k?{key:k,dir:UI.sort.dir==='ascending'?'descending':'ascending'}:{key:k,dir:k==='eta'||k==='done'?'descending':'ascending'};
  saveUI();if(DATA)renderTable(DATA);}));

function renderBottom(d){
  const f=[...(d.failures||[]).map(x=>`${x.cell} ${x.run}: ${x.error}`),...(d.log_failures||[])];
  $('fail-sec').replaceChildren(f.length
    ?el('details',{open:true},el('summary',{},el('h2',{id:'h-fail'},'Failures ',el('span',{class:'t-fail'},`(${f.length})`))),
        el('ul',{class:'fails'},f.map(x=>el('li',{},'✕ '+x))))
    :el('div',{class:'oneline'},el('h2',{id:'h-fail'},'Failures'),el('span',{class:'t-done'},'✓ None'),
        d.superseded?el('span',{class:'muted'},`(${d.superseded} CPU jobs moved to GPU, not counted)`):null));
  const live=d.llm_live||[];
  $('llm-sec').replaceChildren(live.length
    ?el('div',{},el('h2',{id:'h-llm'},'LLM text'),live.map(l=>el('div',{class:'vrow'},el('span',{},`${l.job} `,el('span',{class:'muted'},l.log)),
        el('span',{class:'num t-run'},`${l.percent}% · ${l.left} left`),bar(l.percent,'c-run'))))
    :el('div',{class:'oneline'},el('h2',{id:'h-llm'},'LLM text'),el('span',{class:'muted'},'No generation running. All caches below are final.')));
  const cov={};(d.llm_caches||[]).forEach(r=>cov[`${r.dataset}|${r.kind}|${r.sampler}`]=r);
  const names={discriminative:'Discriminative',residual:'Residual'};
  const cell=(ds,k,s)=>{const r=cov[`${ds}|${k}|${s}`];if(!r)return el('td',{class:'muted'},'—');
    const p=Math.round(100*(r.coverage||0));
    return el('td',{class:'num '+(p<25?'h-low':p<=75?'h-mid':'h-high'),title:`${DS[ds]} · ${names[k]} · ${NAMES[s]}: ${p}% of nodes`},p+'%');};
  $('llm').replaceChildren(...Object.keys(DS).map(ds=>el('tr',{},el('th',{scope:'row'},DS[ds]),
    cell(ds,'discriminative','cosine'),cell(ds,'discriminative','md_K2_matched'),
    cell(ds,'residual','cosine'),cell(ds,'residual','md_K2_matched'))));
}

function render(d){DATA=d;renderHeader(d);renderLeft(d);renderTable(d);renderBottom(d);}
async function poll(){
  try{
    const d=await (await fetch('/api/status',{cache:'no-store'})).json();
    render(d);lastData=d.updated*1000;
    $('banner').hidden=!d.error;if(d.error)$('banner').textContent='Status refresh failed, showing the last good data: '+d.error;
  }catch(e){$('banner').hidden=false;$('banner').textContent="Can't reach the status service. Is server.py running?";}
  const age=(Date.now()-lastData)/1000;
  $('upd').textContent=lastData?`updated ${new Date(lastData).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}${age>90?' · stale':''}`:'';
}
poll();setInterval(poll,20000);
</script></body></html>
